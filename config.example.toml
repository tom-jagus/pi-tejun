# Copy to ~/.config/pi-tejun/config.toml, or run python3 install.py.
# The installer fills these machine-specific values from saved Pi defaults.
# Keep credentials in Pi. Do not store them in this file.
enabled = ["verify"]

[pi]
agent_dir = "/absolute/path/to/.pi/agent"
# A workflow's [model] fields override these saved model defaults.
provider = "your-provider"
model = "your-exact-model-id"
thinking = "low"
extensions = ["/absolute/path/to/.pi/agent/extensions/herdr-agent-state.ts"]
timeout_seconds = 300
# Required only for digest. Explicitly load the installed search extension.
# search_extension = "/absolute/path/to/pi-web-search/src/index.ts"

[paths]
verification = "/absolute/path/to/pi-tejun/verification"
# Digest workspace must exist and contain a manually editable watchlist.md.
# digest_briefs = "~/src/default/digest-briefs"

# Project-review configuration. Verify these machine-specific paths before use.
# The three roots and output workspace must exist; excluded folders need not.
project_directions = "~/dev/default/_projects-directions"
client_projects = "~/dev/clients"
personal_projects = "~/dev/default"
personal_repositories = "~/src/default"
content_production = "~/dev/default/content-production"
# Keep enabled unchanged unless bare `tejun run` should also run the review.
