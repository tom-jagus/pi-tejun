<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 320 200"
  aria-labelledby="tejun-top-green-title tejun-top-green-desc">
  <title id="tejun-top-green-title">Pi Tejun · 手順</title>
  <desc id="tejun-top-green-desc">Large Japanese lettering for Tejun, with a small
    centered pi above and a short rounded line below. Original charcoal and
    off-white colors with a vivid yellow-to-green ring.</desc>

  <defs>
    <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6bf3c"/>
      <stop offset="100%" stop-color="#19c58b"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="100" r="80.5" fill="none"
    stroke="#282B2E" stroke-width="3"/>
  <circle cx="160" cy="100" r="78" fill="#282B2E"
    stroke="url(#ringgrad)" stroke-width="3"/>

  <text x="160" y="46" text-anchor="middle"
    font-size="24" font-weight="700" fill="#f5f7fa"
    font-family="'Liberation Sans','DejaVu Sans',sans-serif">π</text>

  <text x="160" y="129" text-anchor="middle" lang="ja"
    font-size="90" font-weight="800" letter-spacing="-4" fill="#f5f7fa"
    font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Kaku Gothic Pro','Meiryo','Yu Gothic',sans-serif"
    style="paint-order:stroke;stroke:#282B2E;stroke-width:5;stroke-linejoin:round">手順</text>

  <line x1="136" y1="155" x2="184" y2="155"
    stroke="#f5f7fa" stroke-opacity="1" stroke-width="4" stroke-linecap="round"/>
</svg>
